<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ETF Answer Agent — 5단계 파이프라인과 컴플라이언스 검증 게이트를 브라우저에서 그대로 실행하는 데모">
<title>ETF Answer Agent — 브라우저 데모</title>
<style>
:root{
  --ink:#16212B;
  --teal:#0F5C52;
  --red:#A32E22;
  --bg:#F4F6F8;
  --card:#FFFFFF;
  --line:#DCE3E8;
  --line-soft:#EEF2F5;
  --muted:#5E6E7B;
  --soft:#EDF1F4;
  --teal-soft:#E7F0EE;
  --red-soft:#FBEDEB;
  --red-line:#EBC7C1;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.65 "Pretendard","Malgun Gothic","맑은 고딕",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
}
.wrap{max-width:900px;margin:0 auto;padding:0 16px;width:100%}

/* ── 헤더 ── */
.top{background:var(--ink);color:#fff;flex:0 0 auto}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px}
.top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.2px}
.top .tag{margin:3px 0 0;font-size:12px;color:#93A8B5}
.gh{
  flex:0 0 auto;font-size:12px;font-weight:600;color:#CFDCE3;text-decoration:none;
  border:1px solid #3A4A57;border-radius:6px;padding:6px 11px;white-space:nowrap;
}
.gh:hover{background:#22303C;color:#fff}

/* ── 파이프라인 안내 띠 ── */
.pipe{background:#FFFFFF;border-bottom:1px solid var(--line);flex:0 0 auto}
.pipe-in{display:flex;align-items:center;flex-wrap:wrap;gap:5px 7px;padding-top:9px;padding-bottom:9px;font-size:11.5px}
.pipe-item{color:var(--teal);font-weight:600;white-space:nowrap}
.pipe-arw{color:#AEBCC6}
.pipe-note{color:var(--muted);margin-left:auto;white-space:nowrap}

/* ── 대화 영역 ── */
.log{flex:1 1 auto;overflow-y:auto;padding-top:16px;padding-bottom:20px;-webkit-overflow-scrolling:touch}

.intro{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.intro h2{margin:0 0 7px;font-size:14px;font-weight:700}
.intro p{margin:0 0 6px;font-size:13.5px;color:var(--muted)}
.intro p:last-child{margin-bottom:0}

.msg{margin:0 0 16px}
.who{font-size:11px;font-weight:700;color:#8494A0;letter-spacing:.3px;margin:0 0 5px}
.me{display:flex;justify-content:flex-end}
.me .bub{
  background:var(--teal);color:#fff;border-radius:12px 12px 3px 12px;
  padding:9px 14px;font-size:14.5px;max-width:88%;white-space:pre-wrap;word-break:break-word;
}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.body{padding:15px 17px;white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.75}

/* ── 반려 / 차단 알림 ── */
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 17px;font-size:13px;line-height:1.6}
.notice .ico{
  flex:0 0 auto;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:700;margin-top:1px;
}
.notice b{display:block;font-size:13px;margin-bottom:2px}
.notice .why{color:var(--muted);font-size:12px;margin-top:3px}
.n-stop{background:var(--red);color:#fff}
.n-stop .ico{background:#fff;color:var(--red)}
.n-stop .why{color:#F2D6D1}
.n-loop{background:var(--red-soft);color:var(--red);border-bottom:1px solid var(--red-line)}
.n-loop .ico{background:var(--red);color:#fff}
.n-block{background:var(--red-soft);color:var(--red);border-bottom:1px solid var(--red-line)}
.n-block .ico{background:var(--red);color:#fff}

/* ── 근거 칩 ── */
.sec{padding:12px 17px;border-top:1px solid var(--line-soft)}
.sec-h{font-size:11px;font-weight:700;color:#8494A0;letter-spacing:.4px;margin:0 0 8px}
.cites{display:flex;flex-wrap:wrap;gap:6px}
.cite{
  font-size:11.5px;line-height:1.45;background:var(--teal-soft);color:var(--teal);
  border:1px solid #CFE0DB;border-radius:13px;padding:4px 10px;word-break:break-word;
}
.cite-none{font-size:12px;color:var(--muted);margin:0}

/* ── 5단계 처리 경로 배지 ── */
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:7px}
.stage{background:#FAFBFC;border:1px solid var(--line);border-radius:7px;padding:8px 9px}
.stage.bad{background:var(--red-soft);border-color:var(--red-line)}
.stage.off{opacity:.55}
.st-head{display:flex;align-items:center;gap:5px;margin-bottom:4px;flex-wrap:wrap}
.st-n{
  flex:0 0 auto;font-size:11px;font-weight:700;color:#fff;background:var(--teal);
  width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;
}
.stage.bad .st-n{background:var(--red)}
.stage.off .st-n{background:#9BA8B2}
.st-name{font-size:11.5px;font-weight:700;letter-spacing:-.1px}
.st-rep{font-size:10px;font-weight:700;color:var(--red);background:#fff;border:1px solid var(--red-line);border-radius:8px;padding:0 5px}
.st-d{margin:0;font-size:11px;line-height:1.6;color:var(--muted);word-break:break-word}
.st-d + .st-d{margin-top:4px;padding-top:4px;border-top:1px dashed var(--line)}
.st-d.bad{color:var(--red);font-weight:600}
.st-d.off{color:#9BA8B2}
.st-d b{color:var(--ink);font-weight:700}

/* ── 오류 안내 ── */
.err{background:var(--card);border:1px solid var(--red-line);border-left:4px solid var(--red);border-radius:10px;padding:16px 18px}
.err h2{margin:0 0 8px;font-size:14.5px;font-weight:700;color:var(--red)}
.err p{margin:0 0 9px;font-size:13.5px;color:var(--ink)}
.err ol{margin:0 0 9px;padding-left:19px;font-size:13.5px}
.err li{margin-bottom:5px}
.err code{
  display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:4px;
  padding:1px 6px;font-family:Consolas,"Courier New",monospace;font-size:12.5px;color:var(--ink);
  word-break:break-all;
}
.err .detail{margin:10px 0 0;font-size:11.5px;color:var(--muted);font-family:Consolas,"Courier New",monospace;word-break:break-all}

/* ── 입력 독 ── */
.dock{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line)}
.dock-in{padding-top:10px;padding-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.chip{
  font:inherit;font-size:11.5px;line-height:1.4;background:var(--soft);color:#3D4C58;
  border:1px solid var(--line);border-radius:14px;padding:5px 11px;cursor:pointer;text-align:left;
}
.chip:hover:enabled{background:#E2E9EE}
.chip.stop{background:var(--red-soft);color:var(--red);border-color:var(--red-line);font-weight:600}
.chip.stop:hover:enabled{background:#F6DFDB}
.chip:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:7px}
#q{
  flex:1 1 auto;min-width:0;font:inherit;font-size:14.5px;padding:11px 13px;
  border:1px solid #C9D3DA;border-radius:8px;background:#fff;color:var(--ink);
}
#q:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,92,82,.12)}
#q:disabled{background:var(--soft);color:#93A0AA}
#send{
  flex:0 0 auto;font:inherit;font-size:14.5px;font-weight:700;padding:11px 20px;
  background:var(--teal);color:#fff;border:0;border-radius:8px;cursor:pointer;
}
#send:hover:enabled{background:#0C4A42}
#send:disabled{background:#A9B6BE;cursor:default}
.disc{margin:9px 0 0;padding-top:8px;border-top:1px solid var(--line-soft);font-size:11px;line-height:1.55;color:var(--muted)}

@media (max-width:600px){
  .top h1{font-size:15.5px}
  .top .tag{font-size:11px}
  .gh{padding:5px 9px;font-size:11px}
  .pipe-note{margin-left:0;white-space:normal;flex-basis:100%}
  .body{padding:13px 14px;font-size:14px}
  .sec,.notice{padding:11px 14px}
  .stages{grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
  .me .bub{max-width:92%}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <div>
      <h1>ETF Answer Agent</h1>
      <p class="tag">브라우저에서 직접 실행됩니다 · 서버 없음</p>
    </div>
    <a class="gh" href="https://github.com/SungHyunC/etf-answer-agent" target="_blank" rel="noopener noreferrer">GitHub 저장소</a>
  </div>
</header>

<div class="pipe">
  <div class="wrap pipe-in">
    <span class="pipe-item">① 발화 전처리</span><span class="pipe-arw">→</span>
    <span class="pipe-item">② 의도 분류</span><span class="pipe-arw">→</span>
    <span class="pipe-item">③ 기능별 검색</span><span class="pipe-arw">→</span>
    <span class="pipe-item">④ 답변 생성</span><span class="pipe-arw">→</span>
    <span class="pipe-item">⑤ 컴플라이언스 검증</span>
    <span class="pipe-note">⑤에서 반려되면 ④로 되돌아가 재생성</span>
  </div>
</div>

<main class="log" id="log">
  <div class="wrap" id="feed"></div>
</main>

<form class="dock" id="composer" autocomplete="off">
  <div class="wrap dock-in">
    <div class="chips" id="chips"></div>
    <div class="row">
      <input id="q" type="text" placeholder="데이터를 불러오는 중입니다…" aria-label="질문 입력" disabled>
      <button id="send" type="submit" disabled>전송</button>
    </div>
    <p class="disc">ETF 데이터는 데모용 샘플이며 실제 상품 정보가 아닙니다. 투자 판단의 근거로 사용할 수 없습니다.</p>
  </div>
</form>

<script src="./agent.js"></script>
<script>
(function () {
  'use strict';

  var W = window;
  var feed = document.getElementById('feed');
  var logEl = document.getElementById('log');
  var chipsEl = document.getElementById('chips');
  var form = document.getElementById('composer');
  var input = document.getElementById('q');
  var sendBtn = document.getElementById('send');

  var ready = false;

  /* ── 예시 질문 ── */
  var EXAMPLES = [
    { q: 'ETF가 뭔가요?' },
    { q: 'TIGER 미국나스닥100 총보스 얼마애요?' },
    { q: '나스닥100 분배금 언제 지급되나요?' },
    { q: 'ETF 세금은 어떻게 되나요?' },
    { q: '지금 어떤 ETF 사는게 좋을까요?', stop: true },
    { q: '이 ETF 사면 수익률 보장되나요?', stop: true }
  ];

  /* ── 5단계 정의 ── */
  var STAGES = [
    { mark: '①', name: '발화 전처리', hint: '전처리' },
    { mark: '②', name: '의도 분류', hint: '의도분류' },
    { mark: '③', name: '기능별 검색', hint: '검색' },
    { mark: '④', name: '답변 생성', hint: '생성' },
    { mark: '⑤', name: '컴플라이언스 검증', hint: '검증' }
  ];
  var MARKS = ['①', '②', '③', '④', '⑤'];
  // '재생성' 이 '생성' 을 포함하므로 검증을 먼저 확인한다.
  var HINTS = [['전처리', 0], ['의도', 1], ['검색', 2], ['검증', 4], ['컴플라이언스', 4], ['게이트', 4], ['생성', 3]];

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function scrollDown() { logEl.scrollTop = logEl.scrollHeight; }

  /* ── 에이전트 결과 정규화 (키 이름이 달라도 견디도록) ── */
  function firstOf(obj, keys, dflt) {
    for (var i = 0; i < keys.length; i++) {
      var v = obj ? obj[keys[i]] : null;
      if (v !== undefined && v !== null && v !== '') return v;
    }
    return dflt;
  }

  function asArray(v) {
    if (v === undefined || v === null) return [];
    return Object.prototype.toString.call(v) === '[object Array]' ? v : [v];
  }

  function traceLine(t) {
    if (typeof t === 'string') return t;
    if (t && typeof t === 'object') {
      var head = firstOf(t, ['stage', 'step', 'name', 'label'], '');
      var body = firstOf(t, ['detail', 'message', 'text', 'note'], '');
      return [head, body].filter(Boolean).join(' · ');
    }
    return t === undefined || t === null ? '' : String(t);
  }

  function citeLabel(c) {
    if (typeof c === 'string') return c;
    if (c && typeof c === 'object') {
      var bits = [];
      if (c.store) bits.push(c.store);
      if (c.source) bits.push(c.source);
      if (!bits.length && c.title) bits.push(c.title);
      if (!bits.length && c.id) bits.push(c.id);
      if (bits.length) return bits.join(' · ');
      try { return JSON.stringify(c); } catch (e) { return String(c); }
    }
    return c === undefined || c === null ? '' : String(c);
  }

  function stageIndex(line, fallback) {
    for (var i = 0; i < MARKS.length; i++) {
      if (line.indexOf(MARKS[i]) === 0) return i;
    }
    var m = line.match(/^\s*([1-5])\s*[.)\]]/);
    if (m) return parseInt(m[1], 10) - 1;
    for (var j = 0; j < HINTS.length; j++) {
      if (line.indexOf(HINTS[j][0]) >= 0) return HINTS[j][1];
    }
    return Math.min(fallback, 4);
  }

  function detailOf(line, idx) {
    var d = line.replace(/^\s*[①-⑤]\s*/, '').replace(/^\s*[1-5]\s*[.)\]]\s*/, '');
    var parts = d.split('·');
    if (parts.length > 1) {
      var head = parts[0].trim();
      if (head.length <= 12 && head.indexOf(STAGES[idx].hint) >= 0) {
        d = parts.slice(1).join('·').trim();
      }
    }
    return d || '기록 없음';
  }

  /* ── 5단계 배지 ── */
  function stagesHtml(trace) {
    var buckets = [[], [], [], [], []];
    for (var i = 0; i < trace.length; i++) {
      var line = traceLine(trace[i]);
      if (!line) continue;
      var idx = stageIndex(line, i);
      buckets[idx].push({ detail: detailOf(line, idx), bad: /반려|reject/i.test(line) });
    }

    var out = '<div class="stages">';
    for (var s = 0; s < 5; s++) {
      var items = buckets[s];
      var bad = false;
      for (var k = 0; k < items.length; k++) { if (items[k].bad) bad = true; }

      var cls = 'stage' + (bad ? ' bad' : '') + (items.length ? '' : ' off');
      out += '<div class="' + cls + '">';
      out += '<div class="st-head"><span class="st-n">' + STAGES[s].mark + '</span>' +
             '<span class="st-name">' + STAGES[s].name + '</span>' +
             (items.length > 1 ? '<span class="st-rep">×' + items.length + '</span>' : '') +
             '</div>';
      if (items.length) {
        for (var m = 0; m < items.length; m++) {
          out += '<p class="st-d' + (items[m].bad ? ' bad' : '') + '">' +
                 (items.length > 1 ? '<b>#' + (m + 1) + '</b> ' : '') +
                 esc(items[m].detail) + '</p>';
        }
      } else {
        out += '<p class="st-d off">기록 없음</p>';
      }
      out += '</div>';
    }
    out += '</div>';
    return out;
  }

  /* ── 반려 / 차단 알림 ── */
  function noticeHtml(kind, title, why) {
    var icon = kind === 'n-loop' ? '↺' : '!';
    return '<div class="notice ' + kind + '">' +
           '<span class="ico">' + icon + '</span>' +
           '<span><b>' + esc(title) + '</b>' +
           (why ? '<span class="why">' + esc(why) + '</span>' : '') +
           '</span></div>';
  }

  /* ── 답변 카드 ── */
  function renderAnswer(res) {
    if (!res || typeof res !== 'object') res = {};

    var answer = String(firstOf(res, ['answer', 'text', 'output', 'draft'], '(답변이 비어 있습니다)'));
    var citations = asArray(firstOf(res, ['citations', 'sources'], []));
    var trace = asArray(firstOf(res, ['trace', 'steps'], []));
    var verdict = String(firstOf(res, ['verdict', 'status'], '')).toLowerCase();
    var violations = asArray(firstOf(res, ['violations', 'reasons'], []));
    var intent = String(firstOf(res, ['intent'], ''));
    var regen = Number(firstOf(res, ['regenerate_count', 'regenerateCount', 'retries'], 0)) || 0;

    var traceText = [];
    for (var i = 0; i < trace.length; i++) traceText.push(traceLine(trace[i]));
    var joined = traceText.join('\n');

    var rejected = verdict === 'reject' || verdict === 'rejected';
    var looped = !rejected && (regen > 0 || /반려/.test(joined));
    var blocked = intent === 'out_of_scope' || /범위 외|거절문/.test(joined);
    var why = violations.length ? '위반 규칙: ' + violations.map(citeLabel).join(', ') : '';

    var html = '<div class="card">';

    if (rejected) {
      html += noticeHtml('n-stop', '컴플라이언스 게이트 반려 — 재생성 한도 초과',
        (why ? why + ' · ' : '') + '검증을 통과하지 못해 고객에게 나가지 않고 안전 응답으로 대체되었습니다.');
    } else if (looped) {
      html += noticeHtml('n-loop', '컴플라이언스 게이트 반려 후 재생성 → 통과',
        (why ? why + ' · ' : '') + '1차 답변은 고객에게 노출되지 않고 ④ 생성 단계로 되돌아갔습니다.');
    } else if (blocked) {
      html += noticeHtml('n-block', '규제 차단 — 범위 외 요청',
        '투자 권유·종목 추천·수익률 전망으로 해석될 수 있어 답변하지 않고 정중히 거절했습니다.');
    }

    html += '<div class="body">' + esc(answer) + '</div>';

    html += '<div class="sec"><p class="sec-h">근거</p>';
    if (citations.length) {
      html += '<div class="cites">';
      for (var c = 0; c < citations.length; c++) {
        html += '<span class="cite">' + esc(citeLabel(citations[c])) + '</span>';
      }
      html += '</div>';
    } else {
      html += '<p class="cite-none">인용한 근거 문서가 없습니다. (범위 외 요청이거나 검색 결과가 없는 경우)</p>';
    }
    html += '</div>';

    html += '<div class="sec"><p class="sec-h">처리 경로</p>' + stagesHtml(trace) + '</div>';
    html += '</div>';

    var box = document.createElement('div');
    box.className = 'msg';
    box.innerHTML = '<p class="who">에이전트</p>' + html;
    feed.appendChild(box);
    scrollDown();
  }

  function renderQuestion(text) {
    var box = document.createElement('div');
    box.className = 'msg me';
    box.innerHTML = '<div class="bub">' + esc(text) + '</div>';
    feed.appendChild(box);
    scrollDown();
  }

  function renderFailure(text) {
    var box = document.createElement('div');
    box.className = 'msg';
    box.innerHTML = '<p class="who">에이전트</p><div class="err"><h2>실행 중 오류가 발생했습니다</h2>' +
                    '<p class="detail">' + esc(text) + '</p></div>';
    feed.appendChild(box);
    scrollDown();
  }

  /* ── 질문 처리 (동기 호출) ── */
  function askNow(text) {
    renderQuestion(text);
    var res;
    try {
      res = W.ETFAgent.ask(text);
    } catch (e) {
      renderFailure((e && e.message) ? e.message : String(e));
      return;
    }
    if (res && typeof res.then === 'function') {
      res.then(renderAnswer, function (e) {
        renderFailure((e && e.message) ? e.message : String(e));
      });
    } else {
      renderAnswer(res);
    }
  }

  /* ── 예시 칩 ── */
  function buildChips() {
    for (var i = 0; i < EXAMPLES.length; i++) {
      (function (ex) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip' + (ex.stop ? ' stop' : '');
        b.textContent = (ex.stop ? '⛔ ' : '') + ex.q;
        b.disabled = true;
        b.addEventListener('click', function () {
          if (!ready) return;
          input.value = ex.q;
          askNow(ex.q);
          input.value = '';
        });
        chipsEl.appendChild(b);
      })(EXAMPLES[i]);
    }
  }

  function setEnabled(on) {
    ready = on;
    input.disabled = !on;
    sendBtn.disabled = !on;
    var btns = chipsEl.getElementsByTagName('button');
    for (var i = 0; i < btns.length; i++) btns[i].disabled = !on;
    input.placeholder = on ? 'ETF에 대해 물어보세요' : '데이터를 불러오지 못했습니다';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!ready) return;
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    askNow(text);
  });

  /* ── 시작 화면 ── */
  function showIntro() {
    var box = document.createElement('div');
    box.className = 'msg';
    box.innerHTML =
      '<div class="intro">' +
      '<h2>ETF 상담 에이전트 데모</h2>' +
      '<p>질문을 입력하면 ①~⑤ 다섯 단계를 거쳐 답변을 만듭니다. 답변마다 <b>인용한 근거</b>와 <b>처리 경로</b>를 함께 보여 줍니다.</p>' +
      '<p>투자 권유·종목 추천·수익률 전망으로 해석될 수 있는 요청은 ⑤ 컴플라이언스 검증 게이트에서 차단됩니다. 아래 붉은 예시 질문으로 확인해 보세요.</p>' +
      '</div>';
    feed.appendChild(box);
  }

  /* ── 로딩 실패 안내 ── */
  function showLoadError(reason, detail) {
    var body;
    if (reason === 'file') {
      body =
        '<p><code>file://</code> 로 직접 열면 브라우저 보안 정책이 <code>data.json</code> 읽기를 막습니다. ' +
        '아래처럼 로컬 서버로 열어 주세요.</p>' +
        '<ol>' +
        '<li>저장소 최상위 폴더에서 <code>python -m http.server 8080</code> 실행</li>' +
        '<li>브라우저에서 <code>http://localhost:8080/docs/</code> 접속</li>' +
        '</ol>' +
        '<p>GitHub Pages 로 배포된 주소에서는 그대로 동작합니다.</p>';
    } else if (reason === 'agent') {
      body =
        '<p><code>docs/agent.js</code> 를 불러오지 못했거나 <code>window.ETFAgent</code> 가 정의되지 않았습니다.</p>' +
        '<p><code>docs/</code> 폴더에 <code>agent.js</code> 와 <code>data.json</code> 이 함께 있는지 확인해 주세요.</p>';
    } else if (reason === 'data') {
      body =
        '<p><code>docs/data.json</code> 을 찾지 못했습니다. 저장소 최상위에서 아래 명령으로 데이터를 다시 생성해 주세요.</p>' +
        '<ol><li><code>python -m tools.export_data</code></li></ol>';
    } else {
      body =
        '<p><code>docs/data.json</code> 을 불러오는 중 문제가 발생했습니다.</p>' +
        '<p>로컬에서 확인 중이라면 <code>python -m http.server 8080</code> 후 ' +
        '<code>http://localhost:8080/docs/</code> 로 접속해 주세요.</p>';
    }

    var box = document.createElement('div');
    box.className = 'msg';
    box.innerHTML = '<div class="err"><h2>데이터를 불러오지 못했습니다</h2>' + body +
                    (detail ? '<p class="detail">' + esc(detail) + '</p>' : '') + '</div>';
    feed.appendChild(box);
    setEnabled(false);
    scrollDown();
  }

  /* ── 부팅 ── */
  buildChips();
  showIntro();

  if (location.protocol === 'file:') {
    showLoadError('file', 'location.protocol = file:');
    return;
  }

  fetch('./data.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) {
        var err = new Error('HTTP ' + r.status + ' ' + r.statusText);
        err.code = (r.status === 404) ? 'data' : 'other';
        throw err;
      }
      return r.json();
    })
    .then(function (data) {
      if (!W.ETFAgent || typeof W.ETFAgent.init !== 'function' || typeof W.ETFAgent.ask !== 'function') {
        var err = new Error('window.ETFAgent 를 찾을 수 없습니다');
        err.code = 'agent';
        throw err;
      }
      W.ETFAgent.init(data);
      setEnabled(true);
      input.focus();
    })
    .catch(function (e) {
      var code = e && e.code ? e.code : 'other';
      showLoadError(code, (e && e.message) ? e.message : String(e));
    });
})();
</script>
</body>
</html>
