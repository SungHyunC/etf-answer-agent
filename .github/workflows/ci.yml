name: CI

on:
  push:
  pull_request:

# 같은 브랜치에 연속 푸시가 나면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트 + 평가 하네스
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # pip 다운로드 캐시 — requirements.txt 가 그대로면 재사용한다.
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 파이프라인 단위 검증
        run: python tests/test_pipeline.py

      # 목표 지표를 실제로 측정한다. 하네스가 죽으면 CI 도 같이 실패한다.
      - name: 평가 하네스
        run: python -m src.evaluate

  docker:
    name: 이미지 빌드 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 레지스트리 푸시는 하지 않는다. Dockerfile 이 깨지지 않았는지만 확인한다.
      # 레이어 캐시는 GitHub Actions 캐시에 저장해 다음 실행을 줄인다.
      - name: 빌드
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: etf-answer-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
